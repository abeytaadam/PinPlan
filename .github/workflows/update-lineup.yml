name: Update lineup from Pinball Map

on:
  schedule:
    # Twice a day: about 5:17am and 5:17pm in Albuquerque (times are UTC).
    - cron: "17 0,12 * * *"
  # Adds a "Run workflow" button on the Actions tab for an immediate refresh.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lineup
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Skips the job quietly until the Pinball Map key is added as a repository secret.
      HAS_TOKEN: ${{ secrets.PINBALLMAP_API_TOKEN != '' }}
    steps:
      - name: Waiting for the Pinball Map API key
        if: env.HAS_TOKEN != 'true'
        run: echo "PINBALLMAP_API_TOKEN isn't set yet, so there's nothing to sync. Add it under Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v5
        if: env.HAS_TOKEN == 'true'

      - name: Fetch Albuquerque lineups
        if: env.HAS_TOKEN == 'true'
        env:
          PINBALLMAP_API_TOKEN: ${{ secrets.PINBALLMAP_API_TOKEN }}
          # Pinball Map region name. Leave blank and the script looks it up from Sister's
          # listing and prints it; paste that value here to save two requests per run.
          PBM_REGION: ""
        run: node scripts/update-lineup.mjs

      - name: Commit lineup.json and play history if they changed
        if: env.HAS_TOKEN == 'true'
        run: |
          if [ -z "$(git status --porcelain -- lineup.json data/history.json)" ]; then
            echo "Lineup and history unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lineup.json $(ls data/history.json 2>/dev/null)
          git commit -m "Update Albuquerque lineups from Pinball Map"
          git push
