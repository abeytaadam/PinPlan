name: Update player reports

on:
  schedule:
    # Every two hours (UTC). Reading the report sheet doesn't touch the Pinball Map API.
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reports
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # The responses sheet's "Publish to web" CSV link, saved as a repository variable.
      REPORTS_CSV_URL: ${{ vars.REPORTS_CSV_URL }}
    steps:
      - name: Waiting for the report sheet
        if: env.REPORTS_CSV_URL == ''
        run: echo "REPORTS_CSV_URL isn't set yet. Add it under Settings > Secrets and variables > Actions > Variables."

      - uses: actions/checkout@v5
        if: env.REPORTS_CSV_URL != ''

      - name: Pull reports
        if: env.REPORTS_CSV_URL != ''
        run: node scripts/update-reports.mjs

      - name: Commit data/reports.json if it changed
        if: env.REPORTS_CSV_URL != ''
        run: |
          if [ -z "$(git status --porcelain -- data/reports.json)" ]; then
            echo "Reports unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json
          git commit -m "Update player reports"
          git pull --rebase --quiet
          git push
